<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="silverGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="darkBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="60%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.8" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="#38bdf8" opacity="0.04" filter="blur(30px)" />

  <!-- Grouped TexasWebCoders Emblem (Scaled & Centered) -->
  <g transform="translate(68, 88) scale(1.7)">
    <!-- 1. Outer Left Wing -->
    <path
      d="M 12 75 C 12 75 42 50 82 65 C 105 74 125 108 128 135 C 128 135 118 138 108 128 C 90 108 72 88 48 80 C 30 74 12 75 12 75 Z"
      fill="url(#darkBody)"
      stroke="#475569"
      stroke-width="1.5"
    />

    <!-- 2. Inner Wing Bevel -->
    <path
      d="M 22 76 C 42 62 78 72 100 98 C 82 86 52 74 22 76 Z"
      fill="url(#accentFacet)"
      opacity="0.9"
    />

    <!-- 3. Central Silver Swoosh -->
    <path
      d="M 38 88 C 62 72 110 40 160 22 C 145 32 102 65 72 98 C 55 116 42 128 38 128 C 38 128 34 110 38 88 Z"
      fill="url(#silverGlow)"
      filter="url(#glow)"
    />

    <!-- 4. Upward Arrow Head & Right Body -->
    <path
      d="M 98 152 L 208 22 L 142 10 C 142 10 102 68 82 108 C 76 122 88 140 98 152 Z"
      fill="url(#darkBody)"
      stroke="#475569"
      stroke-width="1.5"
    />

    <!-- 5. 3D Bevel Facet -->
    <path
      d="M 208 22 L 142 10 L 128 68 L 208 22 Z"
      fill="url(#accentFacet)"
    />

    <!-- 6. Arrowhead Precision Silver Tip -->
    <path
      d="M 208 22 L 178 48 L 160 32 Z"
      fill="#ffffff"
    />
  </g>
</svg>
